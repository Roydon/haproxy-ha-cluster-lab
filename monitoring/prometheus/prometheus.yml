global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # no Alertmanager in the lab; rules still evaluate and show in Grafana/API

scrape_configs:
  - job_name: haproxy
    metrics_path: /metrics
    static_configs:
      - targets: ["haproxy:8404"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["pg1-exporter:9187", "pg2-exporter:9187", "pg3-exporter:9187"]

  - job_name: mysql
    static_configs:
      - targets: ["mysql1-exporter:9104", "mysql2-exporter:9104", "mysql3-exporter:9104"]

  - job_name: redis
    static_configs:
      - targets: ["redis1-exporter:9121", "redis2-exporter:9121", "redis3-exporter:9121"]
