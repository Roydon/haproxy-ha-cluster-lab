---
- name: Install PGDG apt key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /usr/share/keyrings/pgdg.asc
    mode: "0644"

- name: Add PGDG apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present
    filename: pgdg

- name: Install PostgreSQL and Patroni dependencies
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - "postgresql-client-{{ postgres_version }}"
      - python3-pip
      - python3-psycopg2
    state: present
    update_cache: true

- name: Stop and disable the distro-managed postgresql service (Patroni manages it)
  ansible.builtin.systemd:
    name: postgresql
    state: stopped
    enabled: false
  failed_when: false

- name: Install Patroni via pip
  ansible.builtin.pip:
    name: "patroni[etcd3]=={{ patroni_version | default('3.3.11') }}"
    executable: pip3

- name: Install etcd binary
  ansible.builtin.unarchive:
    src: "https://github.com/etcd-io/etcd/releases/download/{{ etcd_version | default('v3.5.14') }}/etcd-{{ etcd_version | default('v3.5.14') }}-linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ["--strip-components=1", "--wildcards", "*/etcd", "*/etcdctl"]
    creates: /usr/local/bin/etcd
  when: "'etcd' in group_names"

- name: Create etcd user
  ansible.builtin.user:
    name: etcd
    system: true
    shell: /usr/sbin/nologin
  when: "'etcd' in group_names"

- name: Create etcd data directory
  ansible.builtin.file:
    path: /var/lib/etcd
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"
  when: "'etcd' in group_names"

- name: Install etcd systemd unit
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    mode: "0644"
  when: "'etcd' in group_names"
  notify: restart etcd

- name: Enable and start etcd
  ansible.builtin.systemd:
    name: etcd
    enabled: true
    state: started
    daemon_reload: true
  when: "'etcd' in group_names"

- name: Create postgres data directory parent
  ansible.builtin.file:
    path: "{{ postgres_data_dir | dirname }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Render Patroni config
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: /etc/patroni.yml
    owner: postgres
    group: postgres
    mode: "0600"
  notify: restart patroni

- name: Install Patroni systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/patroni.service
    mode: "0644"
    content: |
      [Unit]
      Description=Patroni (PostgreSQL HA)
      After=network.target etcd.service

      [Service]
      Type=simple
      User=postgres
      ExecStart=/usr/local/bin/patroni /etc/patroni.yml
      KillMode=process
      Restart=on-failure
      RestartSec=10
      TimeoutSec=30

      [Install]
      WantedBy=multi-user.target
  notify: restart patroni

- name: Enable and start Patroni
  ansible.builtin.systemd:
    name: patroni
    enabled: true
    state: started
    daemon_reload: true
