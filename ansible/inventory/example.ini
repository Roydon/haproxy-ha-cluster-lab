# Example static inventory for the 7-host production layout: 3 app + 4 db.
# Replace ansible_host with real addresses/DNS names and set real credentials in
# group_vars/all.yml (copy group_vars/all.example.yml -- never commit real secrets).

[app]
app1 ansible_host=10.0.1.11
app2 ansible_host=10.0.1.12
app3 ansible_host=10.0.1.13

[db]
db1 ansible_host=10.0.2.11
db2 ansible_host=10.0.2.12
db3 ansible_host=10.0.2.13
db4 ansible_host=10.0.2.14

# HAProxy and monitoring can run on any host; this example puts both on db1's role
# split across the group below (adjust to your real placement).
[haproxy]
db1

[monitoring]
db1

# Layout used to shard HA roles across the 4 db hosts:
#   db[1:3] -> Postgres/Patroni + etcd (3-node quorum)
#   db[1:2] -> MySQL primary + first replica; db3 -> second MySQL replica
#   db[1:3] -> Redis Cluster masters
[postgres]
db1
db2
db3

[etcd]
db1
db2
db3

[mysql]
db1
db2
db3

[redis]
db1
db2
db3

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
