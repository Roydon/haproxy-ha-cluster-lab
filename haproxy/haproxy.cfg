global
    log stdout format raw local0
    maxconn 4096

# Without this, HAProxy resolves each server's hostname ONCE at startup and caches
# that IP forever -- if a db/app container restarts and gets a new IP (a container
# restart, not just a health-check failure), HAProxy keeps dialing the dead address
# until it's itself restarted. `resolvers` + `resolve-opts allow-dup-ip` on each
# server line makes it re-resolve continuously via the compose network's embedded DNS.
# 127.0.0.11 is filled in at container start from this container's own
# /etc/resolv.conf (see render-haproxy-cfg.sh) rather than hardcoded, because Docker's
# embedded DNS is a fixed 127.0.0.11 but Podman's aardvark-dns listens on the
# network's own gateway IP instead -- there is no single portable constant.
resolvers compose_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 2s
    timeout retry   2s
    hold valid      10s

defaults
    log     global
    mode    http
    option  tcplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 3

#-------------------------------------------------------------------
# Stats + Prometheus metrics
#-------------------------------------------------------------------
frontend stats
    bind *:8404
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s

#-------------------------------------------------------------------
# PostgreSQL: :5000 write (leader), :5001 read (replicas)
# Health check hits Patroni's REST API, which returns 200 only on the
# role that matches the endpoint (/primary, /replica).
#-------------------------------------------------------------------
frontend pg_write_fe
    bind *:5000
    mode tcp
    default_backend pg_write_be

backend pg_write_be
    mode tcp
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none resolvers compose_dns resolve-opts allow-dup-ip
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008

frontend pg_read_fe
    bind *:5001
    mode tcp
    default_backend pg_read_be

backend pg_read_be
    mode tcp
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none resolvers compose_dns resolve-opts allow-dup-ip
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008

#-------------------------------------------------------------------
# MySQL: :3307 write (primary), :3308 read (secondaries)
# Health check hits a small HTTP sidecar next to each mysql node that
# reports /write (200 when read_only=OFF) and /read (200 when a replica).
#-------------------------------------------------------------------
frontend mysql_write_fe
    bind *:3307
    mode tcp
    default_backend mysql_write_be

backend mysql_write_be
    mode tcp
    option httpchk GET /write
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none resolvers compose_dns resolve-opts allow-dup-ip
    server mysql1 mysql1:3306 check port 8081
    server mysql2 mysql2:3306 check port 8081
    server mysql3 mysql3:3306 check port 8081

frontend mysql_read_fe
    bind *:3308
    mode tcp
    default_backend mysql_read_be

backend mysql_read_be
    mode tcp
    balance roundrobin
    option httpchk GET /read
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none resolvers compose_dns resolve-opts allow-dup-ip
    server mysql1 mysql1:3306 check port 8081
    server mysql2 mysql2:3306 check port 8081
    server mysql3 mysql3:3306 check port 8081

#-------------------------------------------------------------------
# App tier: :80 -> PHP-FPM/Nginx and Node backends, round robin
#-------------------------------------------------------------------
frontend app_fe
    bind *:80
    mode http
    option httplog
    default_backend app_be

backend app_be
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 init-addr last,libc,none resolvers compose_dns resolve-opts allow-dup-ip
    server app-php-1 app-php-1:8080 check
    server app-php-2 app-php-2:8080 check
    server app-node-1 app-node-1:8080 check
