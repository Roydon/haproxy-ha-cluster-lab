# Two layers, one compose file, driven by COMPOSE_PROFILES:
#   - no COMPOSE_PROFILES set (or "full")   -> complete topology (this is the default: `make up`)
#   - COMPOSE_PROFILES=lite                 -> CI-sized subset (services below with no `profiles:`
#                                               key always start; only `profiles: ["full"]` services
#                                               are skipped)
# See docs in README.md "Resource note" and CLAUDE.md's lite-profile CI spec.
name: haha

x-restart-policy: &restart_policy
  restart: unless-stopped

networks:
  default:
    name: haha-net

volumes:
  etcd-data:
  pg1-data:
  pg2-data:
  pg3-data:
  mysql1-data:
  mysql2-data:
  mysql3-data:
  redis1-data:
  redis2-data:
  redis3-data:
  grafana-data:
  prometheus-data:

services:
  # --------------------------------------------------------------- DCS (etcd)
  etcd1:
    <<: *restart_policy
    image: quay.io/coreos/etcd:v3.5.14
    container_name: etcd1
    hostname: etcd1
    command:
      - etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380
      - --initial-cluster-state=new
    volumes:
      - etcd-data:/etcd-data
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --------------------------------------------------------------- PostgreSQL / Patroni
  pg1:
    <<: *restart_policy
    build: { context: ., dockerfile: postgres/Dockerfile }
    container_name: pg1
    hostname: pg1
    env_file: .env
    environment:
      NODE_NAME: pg1
      ETCD_HOST: etcd1
    depends_on:
      etcd1:
        condition: service_healthy
    volumes:
      - pg1-data:/home/postgres/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8008/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  pg2:
    <<: *restart_policy
    build: { context: ., dockerfile: postgres/Dockerfile }
    container_name: pg2
    hostname: pg2
    env_file: .env
    environment:
      NODE_NAME: pg2
      ETCD_HOST: etcd1
    depends_on:
      etcd1:
        condition: service_healthy
    volumes:
      - pg2-data:/home/postgres/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8008/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  pg3:
    <<: *restart_policy
    profiles: ["full"]
    build: { context: ., dockerfile: postgres/Dockerfile }
    container_name: pg3
    hostname: pg3
    env_file: .env
    environment:
      NODE_NAME: pg3
      ETCD_HOST: etcd1
    depends_on:
      etcd1:
        condition: service_healthy
    volumes:
      - pg3-data:/home/postgres/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8008/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --------------------------------------------------------------- MySQL (async
  # replication + a promotion script, not Group Replication — see README "Limitations":
  # a deliberate, time-boxed call, not a fallback discovered mid-failure.
  mysql1:
    <<: *restart_policy
    build: { context: ., dockerfile: mysql/Dockerfile }
    container_name: mysql1
    hostname: mysql1
    env_file: .env
    environment:
      MYSQL_ROLE: primary
      MYSQL_SERVER_ID: "1"
    volumes:
      - mysql1-data:/var/lib/mysql
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

  mysql2:
    <<: *restart_policy
    build: { context: ., dockerfile: mysql/Dockerfile }
    container_name: mysql2
    hostname: mysql2
    env_file: .env
    environment:
      MYSQL_ROLE: replica
      MYSQL_SERVER_ID: "2"
      MYSQL_PRIMARY_HOST: mysql1
    depends_on:
      mysql1:
        condition: service_healthy
    volumes:
      - mysql2-data:/var/lib/mysql
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

  mysql3:
    <<: *restart_policy
    profiles: ["full"]
    build: { context: ., dockerfile: mysql/Dockerfile }
    container_name: mysql3
    hostname: mysql3
    env_file: .env
    environment:
      MYSQL_ROLE: replica
      MYSQL_SERVER_ID: "3"
      MYSQL_PRIMARY_HOST: mysql1
    depends_on:
      mysql1:
        condition: service_healthy
    volumes:
      - mysql3-data:/var/lib/mysql
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

  # --------------------------------------------------------------- Redis Cluster
  redis1:
    <<: *restart_policy
    build: { context: ., dockerfile: redis/Dockerfile }
    container_name: redis1
    hostname: redis1
    environment:
      NODE_NAME: redis1
    volumes:
      - redis1-data:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis2:
    <<: *restart_policy
    profiles: ["full"]
    build: { context: ., dockerfile: redis/Dockerfile }
    container_name: redis2
    hostname: redis2
    environment:
      NODE_NAME: redis2
    volumes:
      - redis2-data:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis3:
    <<: *restart_policy
    profiles: ["full"]
    build: { context: ., dockerfile: redis/Dockerfile }
    container_name: redis3
    hostname: redis3
    environment:
      NODE_NAME: redis3
    volumes:
      - redis3-data:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: forms the cluster once redis1 (and redis2/redis3, if this profile started
  # them) are reachable, then exits. Safe to re-run (checks cluster_state first).
  redis-cluster-init:
    build: { context: ., dockerfile: redis/Dockerfile }
    container_name: redis-cluster-init
    entrypoint: ["/scripts/redis-cluster-init.sh"]
    depends_on:
      redis1:
        condition: service_healthy
    volumes:
      - ./scripts/redis-cluster-init.sh:/scripts/redis-cluster-init.sh:ro
    mem_limit: 64m
    restart: "no"

  # --------------------------------------------------------------- App tier
  app-php-1:
    <<: *restart_policy
    build: { context: ., dockerfile: apps/php/Dockerfile }
    container_name: app-php-1
    hostname: app-php-1
    env_file: .env
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  app-php-2:
    <<: *restart_policy
    profiles: ["full"]
    build: { context: ., dockerfile: apps/php/Dockerfile }
    container_name: app-php-2
    hostname: app-php-2
    env_file: .env
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  app-node-1:
    <<: *restart_policy
    profiles: ["full"]
    build: { context: ., dockerfile: apps/node/Dockerfile }
    container_name: app-node-1
    hostname: app-node-1
    env_file: .env
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  # --------------------------------------------------------------- HAProxy
  haproxy:
    <<: *restart_policy
    build: { context: ., dockerfile: haproxy/Dockerfile }
    container_name: haproxy
    hostname: haproxy
    depends_on:
      pg1: { condition: service_healthy }
      pg2: { condition: service_healthy }
      mysql1: { condition: service_healthy }
      mysql2: { condition: service_healthy }
      app-php-1: { condition: service_healthy }
    ports:
      # Host-side ports are overridable in .env. Defaults avoid two common local
      # collisions: macOS AirPlay Receiver squats on 5000/7000, and rootless Podman
      # can't bind <1024 without a VM sysctl change — so the app defaults to 8080
      # instead of 80. Container-internal ports always match the spec exactly.
      - "${HOST_APP_PORT:-8080}:80"
      - "${HOST_PG_WRITE_PORT:-5000}:5000"
      - "${HOST_PG_READ_PORT:-5001}:5001"
      - "${HOST_MYSQL_WRITE_PORT:-3307}:3307"
      - "${HOST_MYSQL_READ_PORT:-3308}:3308"
      - "${HOST_STATS_PORT:-8404}:8404"
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8404/stats"]
      interval: 5s
      timeout: 3s
      retries: 10
